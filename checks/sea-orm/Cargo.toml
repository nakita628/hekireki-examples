[package]
name = "check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# postgres-array enables Vec<T> columns for Prisma scalar lists (String[]).
sea-orm = { version = "1.1", features = ["postgres-array", "with-json", "with-chrono", "with-uuid", "with-rust_decimal", "with-bigdecimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Client-side primary keys for @default(uuid()), @default(uuid(7)) and @default(ulid()).
uuid = { version = "1", features = ["v4", "v7"] }
ulid = "1"
cuid2 = "0.1"
nanoid = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"

[lib]
path = "src/lib.rs"
