packages: []

# prisma's postinstall only downloads a query-engine binary the generators do not run.
# @prisma/engines' postinstall downloads the native schema engine: hekireki-docs writes MySQL's
# CREATE TABLE with it (PostgreSQL and SQLite use the wasm engine). rules_js reads allowBuilds
# to know which packages get a lifecycle action.
allowBuilds:
  prisma: false
  '@prisma/engines': true

minimumReleaseAgeExclude:
  - hekireki@0.47.0
