name: CI

# Generation: every schema under schemas/ is run through hekireki inside Bazel, and the committed
# generated/ tree has to match (except the ER PNG, which depends on the machine's fonts and is
# only checked for being a PNG). The language checks are a separate workflow (lang-check.yml),
# one matrix leg per toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # Every target except the language checks, which need a toolchain Bazel does not ship.
      - run: bazel test --config=ci //...
